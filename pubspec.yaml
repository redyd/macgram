name: macgram
description: "Éditeur de MCD (Merise / UML) dans un fichier JSON lisible par git."
publish_to: 'none'

# Overridden by the release workflow (--build-name) from the git tag.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Bundled (OFL, licences next to the files) so text looks the same on every
  # platform and diagram boxes can be sized from a known character width.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
